[package]
name = "gribwasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "wasm-bindgen wrapper around gribberish for the dynamical.org explorer's GRIB2 zarr codec"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Released gribberish 1.8.4 fixes zero-group constant fields and implicit complex-
# packing descriptors/bitmaps while retaining the stores' codec configuration. No default features:
# "png" is pure Rust, and CCSDS (DRS 5.42) uses gribberish's
# built-in pure-Rust decoder when "libaec" is off, so there is no C code in the build.
gribberish = { git = "https://github.com/mpiannucci/gribberish", rev = "5e039e1f87b9cf6586c4fc060bb52b563ed3ef36", default-features = false, features = ["png"] }
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
panic = "abort"
