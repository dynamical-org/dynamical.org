<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#111111" role="img" aria-labelledby="t d">
  <title id="t">ECMWF IFS ENS archive before and after the backfill</title>
  <desc id="d">Before the backfill the archive started 2024-04-01. After, it starts 2020-10-15, adding about three and a half years of forecasts.</desc>
  <rect width="800" height="250" fill="#ffffff"/>

  <!-- x: 2020-01-01 = 40, 2027-01-01 = 760 -->
  <text x="40" y="28" font-weight="700" font-size="16">ECMWF IFS ENS forecast, 15 day, 0.25 degree</text>

  <text x="40" y="70" fill="#666666">before</text>
  <rect x="477" y="80" width="271" height="24"/>
  <text x="477" y="70">2024-04-01</text>

  <text x="40" y="136" fill="#666666">after</text>
  <rect x="121" y="146" width="627" height="24"/>
  <text x="121" y="136">2020-10-15</text>
  <text x="299" y="136" text-anchor="middle" font-weight="700">+3.5 years</text>

  <line x1="477" y1="108" x2="477" y2="174" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="752" y="97">→</text>
  <text x="752" y="163">→</text>

  <line x1="40" y1="192" x2="760" y2="192" stroke="#111111" stroke-width="1"/>
  <g stroke="#111111" stroke-width="1">
    <line x1="40" y1="192" x2="40" y2="198"/>
    <line x1="142.9" y1="192" x2="142.9" y2="198"/>
    <line x1="245.7" y1="192" x2="245.7" y2="198"/>
    <line x1="348.6" y1="192" x2="348.6" y2="198"/>
    <line x1="451.4" y1="192" x2="451.4" y2="198"/>
    <line x1="554.3" y1="192" x2="554.3" y2="198"/>
    <line x1="657.1" y1="192" x2="657.1" y2="198"/>
    <line x1="760" y1="192" x2="760" y2="198"/>
  </g>
  <g font-size="12" fill="#666666" text-anchor="middle">
    <text x="40" y="216">2020</text>
    <text x="142.9" y="216">2021</text>
    <text x="245.7" y="216">2022</text>
    <text x="348.6" y="216">2023</text>
    <text x="451.4" y="216">2024</text>
    <text x="554.3" y="216">2025</text>
    <text x="657.1" y="216">2026</text>
    <text x="760" y="216">2027</text>
  </g>
  <text x="748" y="238" font-size="12" fill="#666666" text-anchor="end">init_time, UTC · live updating</text>
</svg>
